name: Static Checks

on:
  push:
    branches: [main, "cleanup/*"]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff check-jsonschema pyyaml

      - name: Compile Python Syntax
        run: |
          python -m compileall -q .

      - name: Lint Python Codebase
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Validate Contract Schemas
        run: |
          check-jsonschema --schemafile http://json-schema.org/draft-07/schema# contracts/lexicon_schema.json
          python -c "import yaml; yaml.safe_load(open('contracts/api_openapi.yaml', encoding='utf-8'))"

      - name: Validate Pytest Markers Registration
        run: |
          python -c "
          import os, re, configparser
          marker_pat = re.compile(r'@pytest\.mark\.([a-zA-Z0-9_]+)')
          used_markers = set()
          for root, dirs, files in os.walk('tests'):
              for f in files:
                  if f.endswith('.py'):
                      with open(os.path.join(root, f), 'r', encoding='utf-8') as fp:
                          for line in fp:
                              for m in marker_pat.findall(line):
                                  used_markers.add(m)
          cfg = configparser.ConfigParser()
          cfg.read('pytest.ini')
          defined = set()
          for line in cfg.get('pytest', 'markers').strip().splitlines():
              if ':' in line:
                  defined.add(line.split(':')[0].strip())
          builtin = {'parametrize', 'skip', 'skipif', 'xfail', 'filterwarnings', 'usefixtures'}
          missing = used_markers - defined - builtin
          if missing:
              raise ValueError(f'Undefined markers found in tests: {missing}')
          print(f'All {len(used_markers)} used markers are valid and registered.')
          "
